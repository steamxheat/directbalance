name: Venerdi Metrika audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read counter and goals
        env:
          TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o counter.json -w '%{http_code}' -H "Authorization: OAuth $TOKEN" https://api-metrika.yandex.net/management/v1/counter/62343280)
          echo "counter_http=$code"
          test "$code" = 200
          jq '{id: .counter.id, name: .counter.name, site: .counter.site, mirrors: .counter.mirrors}' counter.json
          code=$(curl -sS -o goals.json -w '%{http_code}' -H "Authorization: OAuth $TOKEN" https://api-metrika.yandex.net/management/v1/counter/62343280/goals)
          echo "goals_http=$code"
          test "$code" = 200
          jq '[.goals[] | select(.id == 166686694 or .id == 164676007) | {id, name, type, conditions}]' goals.json
