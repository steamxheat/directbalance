name: Deploy food group

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply changes in Yandex Direct
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python deploy_food_group.py
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_LOGIN: e-20086596
          APPLY: ${{ inputs.apply }}
