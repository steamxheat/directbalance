name: Direct KSHZ one-off task

on:
  workflow_dispatch:
    inputs:
      mode:
        description: inspect or apply
        required: true
        default: inspect

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - run: python direct_kshz_task.py
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          DIRECT_KSHZ_MODE: ${{ inputs.mode }}
