name: Direct extensions one-off task

on:
  workflow_dispatch:
    inputs:
      mode:
        description: inspect or apply
        required: true
        default: inspect

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python direct_extensions_task.py
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_LOGIN: e-20086596
          DIRECT_EXTENSIONS_MODE: ${{ inputs.mode }}
